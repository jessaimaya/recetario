# Starter vocabulary. Entries are keyed by their English name; `es-MX` is the display label.
# Rules: see the naming guide (lowercase, singular, no brand, no preparation; es-MX market words).
# Loading is idempotent: entries are matched by (kind, en) and updated in place.
# Availability and ownership are personal, so the seed never sets them.

