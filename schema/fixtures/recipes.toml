prep_min = 10
total_min = 10
ingredients = [
  { text = "2 tazas de albahaca", entry = "basil", qty = 2, unit = "taza" },
  { text = "1/3 de taza de nuez de Castilla o nuez", lines = [
    { entry = "walnut", qty = 0.33, unit = "taza", alt = 1 },
    { entry = "pecan", qty = 0.33, unit = "taza", alt = 1 },
  ] },
  { text = "1/2 taza de queso parmesano", entry = "parmesan cheese", qty = 0.5, unit = "taza" },
  { text = "1 diente de ajo", entry = "garlic", qty = 1 },
  { text = "1/2 taza de aceite de oliva", entry = "olive oil", qty = 0.5, unit = "taza" },
]
steps = ["Muele todo en la licuadora o el procesador hasta tener una pasta."]
