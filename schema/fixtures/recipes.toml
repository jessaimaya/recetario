# Ten hand-written recipes (original, not from any book) used by the tests on both sides.
# Each one covers a case of the requirements view; `covers` says which.
#
# Ingredient item: `text` is the raw line. Either give one line inline (entry/qty/unit/prep/optional/alt)
# or several in `lines`. A line has `entry` (English vocabulary name), `sub_recipe` (a recipe key) or
# `unresolved = true`. `alt` puts lines of the same recipe in one OR-group.
# Equipment item: `entry`, optional `optional`, `alt`, `provenance` (listed | inferred, default inferred).
# `produces` names the ingredient a recipe makes, so having that ingredient also satisfies it as a sub-recipe.

[[recipe]]
key = "huevos-a-la-mexicana"
covers = "one raw line -> two staple lines; basic equipment dropped"
title = "Huevos a la mexicana"
servings = 2
prep_min = 5
total_min = 15
ingredients = [
  { text = "4 huevos", entry = "egg", qty = 4 },
  { text = "1 jitomate picado", entry = "tomato", qty = 1, prep = "picado" },
  { text = "1/4 de cebolla picada", entry = "onion", qty = 0.25, prep = "picada" },
  { text = "1 chile serrano picado", entry = "serrano pepper", qty = 1, prep = "picado" },
  { text = "sal y pimienta al gusto", lines = [{ entry = "salt" }, { entry = "black pepper" }] },
]
steps = [
  "Acitrona la cebolla, el jitomate y el chile en un sartén con poco aceite.",
  "Agrega los huevos batidos y mueve hasta que cuajen.",
  "Sazona con sal y pimienta.",
]
equipment = [{ entry = "skillet" }]

[[recipe]]
key = "guacamole"
covers = "optional ingredient and optional equipment dropped"
title = "Guacamole sencillo"
servings = 4
prep_min = 10
total_min = 10
ingredients = [
  { text = "2 aguacates", entry = "avocado", qty = 2 },
  { text = "1 jitomate picado", entry = "tomato", qty = 1, prep = "picado" },
  { text = "1/4 de cebolla picada", entry = "onion", qty = 0.25, prep = "picada" },
  { text = "jugo de 1 limón", entry = "lime", qty = 1, prep = "jugo" },
  { text = "cilantro al gusto (opcional)", entry = "cilantro", optional = true },
  { text = "sal al gusto", entry = "salt" },
]
steps = [
  "Machaca los aguacates.",
  "Mezcla con el jitomate, la cebolla, el limón y la sal.",
]
equipment = [{ entry = "molcajete", optional = true, provenance = "listed" }, { entry = "bowl" }]

[[recipe]]
key = "calabacitas-al-horno"
covers = "non-basic equipment required; attributes with provenance"
title = "Calabacitas al horno con parmesano"
servings = 2
prep_min = 5
total_min = 25
ingredients = [
  { text = "3 calabacitas en rodajas", entry = "zucchini", qty = 3, prep = "en rodajas" },
  { text = "1 cda de aceite de oliva", entry = "olive oil", qty = 1, unit = "cda" },
  { text = "1/4 taza de queso parmesano rallado", entry = "parmesan cheese", qty = 0.25, unit = "taza", prep = "rallado" },
  { text = "1/2 cdita de ajo en polvo", entry = "garlic powder", qty = 0.5, unit = "cdita" },
]
steps = [
  "Precalienta el horno a 200 °C.",
  "Mezcla las calabacitas con el aceite y el ajo en polvo, extiéndelas en una charola.",
  "Cubre con parmesano y hornea 20 minutos.",
]
equipment = [{ entry = "oven" }, { entry = "baking sheet" }]
attributes = [
  { key = "calories_kcal", value = "120", per = "serving", provenance = "manual" },
  { key = "protein_g", value = "6", per = "serving", provenance = "manual" },
]

[[recipe]]
key = "papas-crujientes"
covers = "equipment OR-group (air fryer or oven)"
title = "Papas crujientes con páprika"
servings = 2
prep_min = 5
total_min = 30
ingredients = [
  { text = "2 papas en gajos", entry = "potato", qty = 2, prep = "en gajos" },
  { text = "1 cda de aceite", entry = "oil", qty = 1, unit = "cda" },
  { text = "1 cdita de páprika", entry = "paprika", qty = 1, unit = "cdita" },
  { text = "sal al gusto", entry = "salt" },
]
steps = [
  "Mezcla las papas con el aceite, la páprika y la sal.",
  "Cocina en la freidora de aire a 200 °C por 20 minutos, o en el horno a 220 °C por 25.",
]
equipment = [{ entry = "air fryer", alt = 1 }, { entry = "oven", alt = 1 }]

